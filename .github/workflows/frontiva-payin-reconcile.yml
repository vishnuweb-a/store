
name: Frontiva PayIn Reconciliation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontiva-payin-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reconcile pending PayIn orders
        env:
          RECONCILE_URL: ${{ secrets.FRONTIVA_RECONCILE_URL }}
          CRON_SECRET: ${{ secrets.FRONTIVA_CRON_SECRET }}
        run: |
          test -n "$RECONCILE_URL"
          test -n "$CRON_SECRET"

          curl --fail-with-body --silent --show-error \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$RECONCILE_URL"
